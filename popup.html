<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@500,700,900&display=swap" />
    <style>
      :root {
        --ink: #0a0e15;
        --well: #131a25;
        --paper: #f4f6f8;
        --ghost: #5b6470;
        --muted: #8791a0;
        --teal: #1f9d87;
        --teal-deep: #0f4f45;
      }
      * {
        box-sizing: border-box;
      }
      body {
        width: 252px;
        margin: 0;
        padding: 20px 18px 18px;
        background: var(--ink);
        color: var(--paper);
        font: 500 13px/1.45 "Satoshi", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .wordmark {
        margin: 0 0 18px;
        font-size: 30px;
        font-weight: 900;
        letter-spacing: -0.05em;
        line-height: 1;
      }
      .wordmark .deja {
        color: var(--ghost);
        text-shadow: 2px 1.5px 0 var(--teal-deep);
      }
      .modes {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 2px;
        margin: 0;
        padding: 3px;
        border: 0;
        border-radius: 10px;
        background: var(--well);
      }
      .modes label {
        position: relative;
        padding: 7px 0;
        border-radius: 7px;
        color: var(--muted);
        font-weight: 700;
        text-align: center;
        cursor: pointer;
        transition: background 0.12s, color 0.12s;
      }
      .modes label:hover {
        color: var(--paper);
      }
      .modes input {
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .modes label:has(input:checked) {
        background: var(--paper);
        color: var(--ink);
      }
      .modes label:has(input:focus-visible) {
        outline: 2px solid var(--teal);
        outline-offset: 2px;
      }
      #hint {
        min-height: 2.9em;
        margin: 10px 2px 0;
        color: var(--muted);
        font-size: 12px;
      }
      #stats {
        margin: 14px 2px 0;
        font-size: 12px;
        color: var(--muted);
      }
      #stats strong {
        color: var(--paper);
        font-weight: 700;
      }
      #stats span {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        .modes label {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <h1 class="wordmark"><span class="deja">déjà</span>view</h1>
    <fieldset class="modes" aria-label="What to do with reposted jobs">
      <label><input type="radio" name="mode" value="hide" />Hide</label>
      <label><input type="radio" name="mode" value="label" />Dim</label>
      <label><input type="radio" name="mode" value="off" />Off</label>
    </fieldset>
    <p id="hint"></p>
    <div id="stats"></div>
    <script src="popup.js"></script>
  </body>
</html>
